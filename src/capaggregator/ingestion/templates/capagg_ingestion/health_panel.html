{% load i18n %}
<section class="panel summary" id="capagg-health-panel" data-api-url="{{ api_url }}"
         data-defect-label-one="{% trans 'defect recorded' %}"
         data-defect-label-other="{% trans 'defects recorded' %}">
    <h2>{% trans "Ingestion health (last 30 days)" %}</h2>

    <style>
        #capagg-health-panel {
            border: 1px solid var(--w-color-border-furniture);
            border-radius: 5px;
            overflow: hidden;
            background: var(--w-color-surface-page);
        }

        #capagg-health-panel > h2 {
            margin: 0;
            padding: .75rem 1rem;
            font-size: 1.1em;
            background: var(--w-color-grey-50);
            color: var(--w-color-text-label);
            border-bottom: 1px solid var(--w-color-border-furniture);
        }

        #capagg-health-panel .capagg-body {
            padding: 1rem;
        }

        #capagg-health-panel .capagg-banner {
            padding: .5rem 1rem;
            margin-bottom: .5rem;
            border-radius: 4px;
            background: var(--w-color-critical-200);
            color: var(--w-color-white);
            font-weight: 600;
        }

        #capagg-health-panel .capagg-rows {
            max-height: 24rem;
            overflow-y: auto;
        }

        #capagg-health-panel table {
            width: 100%;
            border-collapse: collapse;
        }

        #capagg-health-panel td, #capagg-health-panel th {
            padding: .6rem .75rem;
            white-space: nowrap;
            border-bottom: 1px solid var(--w-color-border-furniture);
        }

        #capagg-health-panel tbody tr:last-child td {
            border-bottom: none;
        }

        /* Trailing "opens in a new tab" marker on external links. */
        #capagg-health-panel .capagg-external-icon {
            width: .8em;
            height: .8em;
            margin-inline-start: .35em;
            vertical-align: -.05em;
        }

    </style>
    {% include "capagg_ingestion/_health_cells.html" %}

    <div class="capagg-body">
        {% include "capagg_ingestion/_health_cells_legend.html" %}

        <div class="capagg-banner" hidden></div>
        <div class="capagg-rows">
            <table>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const panel = document.getElementById("capagg-health-panel");
            const apiUrl = panel.dataset.apiUrl;
            const banner = panel.querySelector(".capagg-banner");
            const tbody = panel.querySelector("tbody");

            function defectLabel(n) {
                return n === 1 ? panel.dataset.defectLabelOne : panel.dataset.defectLabelOther;
            }

            function paint(data) {
                if (data.mqtt_consumer_connected === false) {
                    banner.textContent = "{% trans 'MQTT consumer disconnected — push ingestion is stopped.' %}";
                    banner.hidden = false;
                } else {
                    banner.hidden = true;
                }
                tbody.innerHTML = "";
                (data.authorities || []).forEach(function (a) {
                    const tr = document.createElement("tr");

                    const name = document.createElement("td");
                    name.textContent = a.name + " (" + (a.country_name || "").toUpperCase() + ")";
                    if (a.website) {
                        const site = document.createElement("a");
                        site.href = a.website;
                        site.target = "_blank";
                        site.rel = "noopener noreferrer";
                        const label = a.name + " {% trans 'website (opens in a new tab)' %}";
                        site.title = label;
                        site.setAttribute("aria-label", label);
                        // Wagtail's admin icon sprite is already on the page.
                        site.innerHTML = '<svg class="icon capagg-external-icon" aria-hidden="true">'
                            + '<use href="#icon-link-external"></use></svg>';
                        name.appendChild(site);
                    }
                    tr.appendChild(name);

                    const cellsTd = document.createElement("td");
                    const cells = document.createElement("span");
                    cells.className = "capagg-cells";
                    const defects = a.defects || [];
                    (a.statuses || []).forEach(function (status, i) {
                        const c = document.createElement("span");
                        const n = defects[i] || 0;
                        c.className = "capagg-cell " + status + (n ? " capagg-cell--defective" : "");
                        c.title = data.days[i] + ": " + status
                            + (n ? " — " + n + " " + defectLabel(n) : "");
                        cells.appendChild(c);
                    });
                    cellsTd.appendChild(cells);
                    tr.appendChild(cellsTd);

                    const actions = document.createElement("td");
                    const link = document.createElement("a");
                    link.className = "button button-small button-secondary";
                    link.href = a.detail_url;
                    link.textContent = "{% trans 'Detail' %}";
                    actions.appendChild(link);
                    tr.appendChild(actions);

                    tbody.appendChild(tr);
                });
            }

            function refresh() {
                fetch(apiUrl, {headers: {"Accept": "application/json"}})
                    .then(function (r) {
                        return r.json();
                    })
                    .then(paint)
                    .catch(function () { /* transient; next tick retries */
                    });
            }

            refresh();
            setInterval(refresh, 60000);
        });
    </script>
</section>
